name: sentinel-cloud

x-cloud-app: &cloud-app
  image: raven-cloud:${SENTINEL_IMAGE_TAG:-local}
  restart: unless-stopped
  env_file:
    - ${SENTINEL_CLOUD_ENV_FILE:-.env.production}
  environment: &cloud-environment
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 8787
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    SENTINEL_DATA_DIR: /var/lib/sentinel-cloud/data
  volumes:
    - cloud_data:/var/lib/sentinel-cloud/data
  depends_on:
    cloud-migrate:
      condition: service_completed_successfully
    cloud-redis:
      condition: service_healthy

services:
  cloud-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - cloud_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  cloud-redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - cloud_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  cloud-migrate:
    image: raven-cloud:${SENTINEL_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    restart: "no"
    env_file:
      - ${SENTINEL_CLOUD_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SENTINEL_DATA_DIR: /var/lib/sentinel-cloud/data
    volumes:
      - cloud_data:/var/lib/sentinel-cloud/data
    depends_on:
      cloud-postgres:
        condition: service_healthy
    command: ["node", "apps/api-server/scripts/migrate.mjs"]

  cloud-api:
    <<: *cloud-app
    environment:
      <<: *cloud-environment
      SENTINEL_TLS_CERT_FILE: /run/secrets/cloud_tls_cert
      SENTINEL_TLS_KEY_FILE: /run/secrets/cloud_tls_key
    secrets:
      - cloud_tls_cert
      - cloud_tls_key
    ports:
      - "${SENTINEL_CLOUD_BIND_ADDRESS:-0.0.0.0}:${SENTINEL_CLOUD_HOST_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:https').get('https://127.0.0.1:8787/health',{rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18

  worker-scheduler:
    <<: *cloud-app
    command: ["node", "apps/api-server/src/worker.mjs", "--role=scheduler"]

  worker-snapshot:
    <<: *cloud-app
    command: ["node", "apps/api-server/src/worker.mjs", "--role=snapshot"]

  worker-io:
    <<: *cloud-app
    command: ["node", "apps/api-server/src/worker.mjs", "--role=io"]

  worker-maintenance:
    <<: *cloud-app
    command: ["node", "apps/api-server/src/worker.mjs", "--role=maintenance"]

secrets:
  cloud_tls_cert:
    file: ${SENTINEL_TLS_CERT_HOST_PATH:?SENTINEL_TLS_CERT_HOST_PATH is required}
  cloud_tls_key:
    file: ${SENTINEL_TLS_KEY_HOST_PATH:?SENTINEL_TLS_KEY_HOST_PATH is required}

volumes:
  cloud_data:
  cloud_postgres_data:
  cloud_redis_data:
